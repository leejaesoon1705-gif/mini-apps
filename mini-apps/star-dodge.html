<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별똥별 피하기</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#050816; color:#fff; font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif; }
  canvas { display:block; touch-action:none; }
  .hud { position:fixed; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; pointer-events:none; font-size:1.1rem; text-shadow:0 2px 6px #000; }
  .hud a { pointer-events:auto; color:#fff9; text-decoration:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:#050816cc; padding:16px; }
  .overlay h1 { font-size:2.6rem; margin:0 0 8px; }
  .overlay p { color:#b8c0ff; margin:6px 0; }
  .overlay button { margin-top:20px; font:inherit; font-size:1.2rem; padding:12px 36px; border:none; border-radius:14px; background:#ffcc33; color:#221; font-weight:700; cursor:pointer; }
  .hidden { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span><a href="index.html">←</a> &nbsp;⭐ <b id="score">0</b></span><span id="lives"></span><span>🏆 <b id="best">0</b></span></div>
<div class="overlay" id="menu">
  <h1>🚀 별똥별 피하기</h1>
  <p>마우스 / 터치 / 방향키로 우주선을 움직이세요</p>
  <p>☄️ 운석은 피하고 ⭐ 별을 모으세요 · 💖 하트는 목숨 +1</p>
  <p id="result"></p>
  <button id="play">시작하기</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, ship, rocks, items, parts, bgStars, score, lives, speed, running = false, lastT, spawnT, keys = {}, pointer = null, invuln = 0, shake = 0;
let best = 0; try { best = +localStorage.getItem('sd-best') || 0; } catch {}
$('best').textContent = best;

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
bgStars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2 }));

function reset() {
  ship = { x: W / 2, y: H - 100, r: 16 };
  rocks = []; items = []; parts = []; score = 0; lives = 3; speed = 1; spawnT = 0; invuln = 0;
  updateHud();
}
function updateHud() { $('score').textContent = score; $('lives').textContent = '❤️'.repeat(lives); }

function spawn() {
  const r = Math.random();
  if (r < 0.14) items.push({ x: Math.random() * W, y: -20, r: 12, vy: 2 + speed, type: Math.random() < 0.12 ? 'heart' : 'star', rot: 0 });
  else {
    const size = 12 + Math.random() * 26;
    const pts = Array.from({ length: 9 }, (_, i) => size * (0.75 + Math.random() * 0.35));
    rocks.push({ x: Math.random() * W, y: -size, r: size, vy: 2.5 + Math.random() * 2.5 * speed + speed, vx: (Math.random() - .5) * 1.5, rot: 0, vr: (Math.random() - .5) * .08, pts });
  }
}
function burst(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * 5 + 1; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color }); }
}
function sfx(f, d = .12, type = 'square') {
  try {
    sfx.ac ||= new AudioContext();
    const ac = sfx.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * (type === 'sawtooth' ? .3 : 2), ac.currentTime + d);
    g.gain.setValueAtTime(.08, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch {}
}

function update(dt) {
  speed = 1 + score / 40;
  // move ship
  const k = 7 * dt;
  if (keys.ArrowLeft || keys.a) ship.x -= k; if (keys.ArrowRight || keys.d) ship.x += k;
  if (keys.ArrowUp || keys.w) ship.y -= k; if (keys.ArrowDown || keys.s) ship.y += k;
  if (pointer) { ship.x += (pointer.x - ship.x) * 0.2 * dt; ship.y += (pointer.y - 40 - ship.y) * 0.2 * dt; }
  ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x)); ship.y = Math.max(ship.r, Math.min(H - ship.r, ship.y));
  parts.push({ x: ship.x + (Math.random() - .5) * 6, y: ship.y + 18, vx: 0, vy: 3 + Math.random() * 2, life: .6, color: Math.random() < .5 ? '#ffb347' : '#ff5e3a' });

  spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(6, 28 - speed * 5) * (0.6 + Math.random() * 0.8); }
  if (invuln > 0) invuln -= dt;

  for (const r of rocks) {
    r.y += r.vy * dt; r.x += r.vx * dt; r.rot += r.vr * dt;
    if (invuln <= 0 && Math.hypot(r.x - ship.x, r.y - ship.y) < r.r * .85 + ship.r * .7) {
      r.dead = true; lives--; invuln = 90; shake = 14; burst(r.x, r.y, '#ff6b6b', 30); sfx(180, .35, 'sawtooth'); updateHud();
      if (lives <= 0) return gameOver();
    }
  }
  for (const it of items) {
    it.y += it.vy * dt; it.rot += .05 * dt;
    if (Math.hypot(it.x - ship.x, it.y - ship.y) < it.r + ship.r) {
      it.dead = true;
      if (it.type === 'heart') { lives = Math.min(lives + 1, 5); burst(it.x, it.y, '#ff7eb6'); sfx(660, .2, 'sine'); }
      else { score++; burst(it.x, it.y, '#ffd84d', 12); sfx(880); }
      updateHud();
    }
  }
  rocks = rocks.filter(r => !r.dead && r.y < H + 60);
  items = items.filter(i => !i.dead && i.y < H + 30);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= .025 * dt; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake -= dt;
}

function starPath(x, y, R, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? R * .45 : R, a = rot + i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#050816'; ctx.fillRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  for (const s of bgStars) {
    s.y += s.z * 0.002 * (running ? speed : .5); if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    ctx.fillStyle = `rgba(255,255,255,${s.z})`; ctx.fillRect(s.x * W, s.y * H, s.z * 2, s.z * 2);
  }
  if (!ship) return;
  for (const p of parts) { ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  for (const r of rocks) {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.beginPath(); r.pts.forEach((d, i) => { const a = i / r.pts.length * 6.283; ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d); }); ctx.closePath();
    ctx.fillStyle = '#6b5b53'; ctx.fill(); ctx.strokeStyle = '#a08878'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#524540'; ctx.beginPath(); ctx.arc(r.r * .25, -r.r * .2, r.r * .22, 0, 6.28); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,120,60,.25)'; ctx.beginPath(); ctx.ellipse(r.x - r.vx * 4, r.y - r.r - 10, r.r * .5, r.r, 0, 0, 6.28); ctx.fill();
  }
  for (const it of items) {
    ctx.shadowBlur = 18;
    if (it.type === 'heart') { ctx.shadowColor = '#ff7eb6'; ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💖', it.x, it.y); }
    else { ctx.shadowColor = '#ffd84d'; ctx.fillStyle = '#ffd84d'; starPath(it.x, it.y, it.r, it.rot); ctx.fill(); }
    ctx.shadowBlur = 0;
  }
  if (invuln > 0 && Math.floor(invuln / 5) % 2) return;
  ctx.save(); ctx.translate(ship.x, ship.y);
  ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(14, 14); ctx.lineTo(0, 8); ctx.lineTo(-14, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4cc9f0'; ctx.beginPath(); ctx.arc(0, -4, 5, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ff5e3a'; ctx.fillRect(-14, 10, 5, 6); ctx.fillRect(9, 10, 5, 6);
  ctx.restore();
}

function frame(t) {
  const dt = Math.min((t - (lastT || t)) / 16.67, 3); lastT = t;
  if (running) update(dt);
  draw();
  requestAnimationFrame(frame);
}
function gameOver() {
  running = false;
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('sd-best', best); } catch {} $('best').textContent = best; }
  $('result').innerHTML = `<b style="font-size:1.4rem;color:#fff">점수: ${score} ⭐</b>${isBest ? '<br>🎉 최고 기록 갱신!' : ''}`;
  $('play').textContent = '다시 하기';
  $('menu').classList.remove('hidden');
}
function start() { reset(); running = true; $('menu').classList.add('hidden'); }

$('play').onclick = start;
addEventListener('keydown', e => { keys[e.key] = true; if ((e.key === 'Enter' || e.key === ' ') && !running) start(); });
addEventListener('keyup', e => keys[e.key] = false);
cv.addEventListener('pointermove', e => pointer = { x: e.clientX, y: e.clientY });
cv.addEventListener('pointerdown', e => pointer = { x: e.clientX, y: e.clientY });
cv.addEventListener('pointerleave', () => pointer = null);
requestAnimationFrame(frame);
</script>
</body>
</html>
