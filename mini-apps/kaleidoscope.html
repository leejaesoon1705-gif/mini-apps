<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>만화경 그림판</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#07070f; color:#eef; font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif; }
  canvas { display:block; touch-action:none; cursor:crosshair; }
  .bar { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
         background:#ffffff14; backdrop-filter:blur(10px); border:1px solid #ffffff22; padding:10px 14px; border-radius:16px; max-width:calc(100% - 24px); font-size:.9rem; }
  .bar label { display:flex; align-items:center; gap:6px; }
  .bar button, .bar a { font:inherit; color:#eef; background:#ffffff1a; border:none; padding:6px 12px; border-radius:10px; cursor:pointer; text-decoration:none; }
  .bar button:hover, .bar a:hover { background:#ffffff33; }
  .bar button.on { background:#8b5cf6; }
  input[type=range] { width:80px; accent-color:#8b5cf6; }
  .hint { position:fixed; bottom:18px; width:100%; text-align:center; color:#ffffff66; pointer-events:none; transition:opacity 1s; }
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">←</a>
  <label>대칭 <input id="sym" type="range" min="2" max="16" value="8"><b id="symV">8</b></label>
  <label>굵기 <input id="size" type="range" min="1" max="30" value="4"></label>
  <button id="mirror" class="on" title="거울 대칭">🪞 거울</button>
  <button id="glow" class="on" title="빛 번짐">✨ 발광</button>
  <button id="fade" title="서서히 사라짐">🌫 잔상</button>
  <button id="auto" title="자동 그리기">🤖 자동</button>
  <button id="clear">지우기</button>
  <button id="saveBtn">💾 저장</button>
</div>
<div class="hint" id="hint">화면에 드래그해서 그려 보세요 · 단축키: C 지우기, S 저장, A 자동</div>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, dpr, hue = 0, drawing = false, last = null, autoOn = false, fadeOn = false, t = 0;
const opts = { mirror: true, glow: true };

function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  const snap = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  bg(); if (snap) ctx.putImageData(snap, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = ctx.lineJoin = 'round';
}
function bg() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

function stroke(a, b) {
  const n = +$('sym').value, cx = W / 2, cy = H / 2;
  const w = +$('size').value * (0.6 + Math.min(Math.hypot(b.x - a.x, b.y - a.y), 40) / 40);
  hue = (hue + 1.5) % 360;
  ctx.strokeStyle = `hsl(${hue} 90% 62%)`; ctx.lineWidth = w;
  ctx.shadowBlur = opts.glow ? w * 3 : 0; ctx.shadowColor = `hsl(${hue} 100% 60%)`;
  for (let i = 0; i < n; i++) {
    for (const m of opts.mirror ? [1, -1] : [1]) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(i * 2 * Math.PI / n); ctx.scale(1, m);
      ctx.beginPath(); ctx.moveTo(a.x - cx, a.y - cy); ctx.lineTo(b.x - cx, b.y - cy); ctx.stroke();
      ctx.restore();
    }
  }
}

cv.addEventListener('pointerdown', e => { drawing = true; last = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); $('hint').style.opacity = 0; });
cv.addEventListener('pointermove', e => { if (!drawing) return; const p = { x: e.clientX, y: e.clientY }; stroke(last, p); last = p; });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => drawing = false));

function loop() {
  if (fadeOn) { ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(7,7,15,0.04)'; ctx.fillRect(0, 0, W, H); }
  if (autoOn) {
    t += 0.02;
    const r = Math.min(W, H) * 0.38;
    const p = { x: W / 2 + r * Math.sin(t * 1.3) * Math.cos(t * 0.7), y: H / 2 + r * Math.sin(t * 0.9) * Math.sin(t * 1.7) };
    if (autoLast) stroke(autoLast, p); autoLast = p;
  }
  requestAnimationFrame(loop);
}
let autoLast = null;

function toggle(id, fn) { $(id).onclick = () => { const on = fn(); $(id).classList.toggle('on', on); }; }
toggle('mirror', () => opts.mirror = !opts.mirror);
toggle('glow', () => opts.glow = !opts.glow);
toggle('fade', () => fadeOn = !fadeOn);
toggle('auto', () => { autoLast = null; $('hint').style.opacity = 0; return autoOn = !autoOn; });
$('clear').onclick = bg;
$('sym').oninput = () => $('symV').textContent = $('sym').value;
$('saveBtn').onclick = () => { const a = document.createElement('a'); a.download = 'kaleidoscope.png'; a.href = cv.toDataURL(); a.click(); };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'c') bg(); else if (k === 's') $('saveBtn').click(); else if (k === 'a') $('auto').click();
});
addEventListener('resize', resize);
resize(); loop();
</script>
</body>
</html>
